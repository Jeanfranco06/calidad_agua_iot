name: Build React Native Android APK

on:
  push:
    branches: [feat/anthony]
    paths:
      - "mobile-rn/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile-rn/package-lock.json

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: >-
            platforms;android-36
            build-tools;36.0.0
            ndk;27.1.12297006

      - name: Install JavaScript dependencies
        working-directory: mobile-rn
        run: npm ci

      - name: Build installable release APK
        working-directory: mobile-rn/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK signature
        working-directory: mobile-rn/android
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agua-clara-react-native-apk
          path: mobile-rn/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
