<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradientes de Alta Fidelidad -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1526"/>
      <stop offset="50%" stop-color="#040912"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>

    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00f2a9"/>
    </linearGradient>

    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 229, 255, 0.85)"/>
      <stop offset="70%" stop-color="rgba(2, 132, 199, 0.75)"/>
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0.9)"/>
    </linearGradient>

    <linearGradient id="rayGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb703" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00f2a9" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#00e5ff" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Fondo Escudo Redondeado -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="506" height="506" x="3" y="3" rx="125" fill="none" stroke="url(#cyanNeon)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Trazos de Circuito Electrónico Ciberfísico -->
  <g stroke="rgba(255, 255, 255, 0.08)" stroke-width="3" stroke-linecap="round">
    <line x1="80" y1="140" x2="180" y2="140"/>
    <circle cx="80" cy="140" r="6" fill="#00e5ff"/>
    <line x1="180" y1="140" x2="220" y2="180"/>
    
    <line x1="432" y1="140" x2="332" y2="140"/>
    <circle cx="432" cy="140" r="6" fill="#00f2a9"/>
    <line x1="332" y1="140" x2="292" y2="180"/>

    <line x1="80" y1="372" x2="180" y2="372"/>
    <circle cx="80" cy="372" r="6" fill="#38bdf8"/>
    
    <line x1="432" y1="372" x2="332" y2="372"/>
    <circle cx="432" cy="372" r="6" fill="#ffb703"/>
  </g>

  <!-- Haz Óptico de Dispersión TS-300B -->
  <path d="M 60 256 L 452 256" stroke="url(#rayGrad)" stroke-width="4" stroke-dasharray="12 8" opacity="0.4" filter="url(#neonGlow)"/>

  <!-- Halo Bioluminiscente Central -->
  <circle cx="256" cy="270" r="140" fill="rgba(0, 229, 255, 0.12)" filter="url(#neonGlow)"/>

  <!-- Gota de Agua con Índice de Refracción Óptica -->
  <g filter="url(#dropShadow)">
    <path d="M 256 120 C 256 120 156 260 156 320 C 156 375.2 200.8 420 256 420 C 311.2 420 356 375.2 356 320 C 356 260 256 120 256 120 Z" 
          fill="url(#waterGrad)"/>
    
    <!-- Brillo Especular de Superficie -->
    <path d="M 230 180 C 210 230 180 290 180 324 C 180 340 188 358 196 366 C 190 354 186 338 186 320 C 186 280 216 220 230 180 Z" 
          fill="#ffffff" opacity="0.6"/>

    <!-- Haz de Dispersión Óptica que Atraviesa la Gota -->
    <ellipse cx="256" cy="320" rx="70" ry="16" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.5"/>
    <circle cx="256" cy="320" r="18" fill="#ffffff" opacity="0.9" filter="url(#neonGlow)"/>
    <circle cx="256" cy="320" r="8" fill="#00e5ff"/>
  </g>

  <!-- Ondas Concéntricas en la Base -->
  <path d="M 180 440 C 220 455 292 455 332 440" fill="none" stroke="url(#cyanNeon)" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <path d="M 210 460 C 235 468 277 468 302 460" fill="none" stroke="#00f2a9" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
</svg>
